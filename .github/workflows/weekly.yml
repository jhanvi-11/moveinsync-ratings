name: Weekly ratings refresh

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Store snapshot
        run: python src/baseline.py

      - name: Scrape new reviews (incremental)
        run: python src/scrape.py

      - name: Clean and flag reviews
        run: python src/clean.py

      - name: Classify new reviews (uses API credits)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/classify.py

      - name: Analyze
        run: python src/analyze.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.db data/rating_snapshots.csv data/out
          git diff --staged --quiet || git commit -m "chore: weekly ratings refresh"
          git push
